name: Build offline WinUtil

on:
  push:
    branches: [ main ]     # builds right after you upload the files
  schedule:
    - cron: '0 3 * * *'    # daily; only publishes when upstream has a new stable release
  workflow_dispatch:       # manual run from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Download latest stable winutil.ps1 and its license
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest "https://github.com/ChrisTitusTech/winutil/releases/latest/download/winutil.ps1" -OutFile "winutil.ps1"
          Invoke-WebRequest "https://raw.githubusercontent.com/ChrisTitusTech/winutil/main/LICENSE" -OutFile "LICENSE-WinUtil.txt"
          $m = Select-String -Path "winutil.ps1" -Pattern 'Version\s*:\s*(\S+)' | Select-Object -First 1
          $ver = $m.Matches[0].Groups[1].Value
          if (-not $ver) { throw "Could not read WinUtil version" }
          "VERSION=$ver" >> $env:GITHUB_ENV
          Write-Host "Upstream WinUtil version: $ver"

      - name: Check whether this version is already released
        id: check
        shell: pwsh
        run: |
          gh release view "v$env:VERSION" *> $null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT } else { "exists=false" >> $env:GITHUB_OUTPUT }
          exit 0

      - name: Build WinUtil-Offline.exe
        if: steps.check.outputs.exists == 'false'
        shell: pwsh
        run: |
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /optimize+ /out:WinUtil-Offline.exe /reference:System.Windows.Forms.dll /resource:winutil.ps1,winutil.ps1 WinUtil.cs
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }

      - name: Publish release
        if: steps.check.outputs.exists == 'false'
        shell: pwsh
        run: |
          gh release create "v$env:VERSION" "WinUtil-Offline.exe" "LICENSE-WinUtil.txt" `
            --title "WinUtil Offline $env:VERSION" `
            --notes "Unofficial offline launcher bundling WinUtil $env:VERSION by Chris Titus Tech (MIT license, see LICENSE-WinUtil.txt). The exe is unsigned, so Windows SmartScreen may show a warning."
